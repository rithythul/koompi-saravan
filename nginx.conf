upstream sarawan_api {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name api.sarawan.social;

    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$host$request_uri;

    # Allow health check without HTTPS
    location /health {
        proxy_pass http://sarawan_api;
        access_log off;
    }

    # Everything else requires HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.sarawan.social;

    ssl_certificate     /etc/letsencrypt/live/api.sarawan.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sarawan.social/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req zone=api burst=10 nodelay;

    # Body size limit (50MB for media uploads)
    client_max_body_size 50M;

    location / {
        proxy_pass http://sarawan_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long uploads
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/sarawan_access.log;
    error_log  /var/log/nginx/sarawan_error.log;
}
